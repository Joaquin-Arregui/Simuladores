<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Modeler</title>


  <link rel="icon" type="image/png" href="favicon.png" />

  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SimBPMN" />
  <meta property="og:title" content="BPMN Modeling and Simulation" />
  <meta property="og:url" content="https://github.com/Joaquin-Arregui/SimBPMN" />
  <meta property="og:description" content="A Bpmn modeler and simulator with colaboration and multi-instance elements." />
</head>
<body>

  <div class="canvas-parent">
    <div id="canvas" class="canvas"></div>
    <div id="properties-panel" class="properties-panel open"></div>
  </div>  


  <div class="links bottom-links">
    <div class="simulation-actions">
      <button class="link active" id="js-simulate" title="Simular el modelo BPMN">Simular</button>
      <button class="link active" id="js-continue" title="Ver la última simulación completada" disabled>Última simulación</button>
    </div>
    <p id="simulation-status" class="simulation-status" role="status" aria-live="polite">Listo para simular.</p>
  </div>
  <div class="modal-overlay" style="display: none;">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="simulation-title" tabindex="-1">
      <h2 id="simulation-title">Resultados de la simulación</h2>
      <pre id="simulation-results">Results of the simulation</pre>
      <button id="close-modal">Cerrar</button>
    </div>
  </div>
  <script src="./dist/modeler.js"></script>
</body>
</html>

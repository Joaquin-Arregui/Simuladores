<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Modeler</title>


  <link rel="icon" type="image/png" href="favicon.png" />

  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SimBPMN" />
  <meta property="og:title" content="BPMN Modeling and Simulation" />
  <meta property="og:url" content="https://github.com/Joaquin-Arregui/SimulacionOrquestada" />
  <meta property="og:description" content="A Bpmn modeler and simulator with colaboration and multi-instance elements." />
</head>
<body>

  <div class="canvas-parent">
    <div id="canvas" class="canvas"></div>
    <div id="properties-panel" class="properties-panel open"></div>
  </div>  


  <div class="links bottom-links">
    <div class="simulation-actions">
      <button class="link active" id="js-simulate" title="Simular el modelo BPMN">Simular</button>
      <button class="link active" id="js-continue" title="Ver la última simulación completada" disabled>Última simulación</button>
      <button class="link active" id="js-replay" title="Reproducir la última simulación sobre el diagrama" disabled>Reproducir</button>
      <button class="link active" id="js-load" title="Cargar de disco los registros de una simulación y, si acaso, su diagrama">Cargar registros</button>
      <input type="file" id="js-load-input" accept=".xes,.bpmn,.xml" multiple hidden>
    </div>
    <p id="simulation-status" class="simulation-status" role="status" aria-live="polite">Listo para simular.</p>
  </div>
  <section id="replay" class="replay" aria-label="Reproducción de la simulación" hidden>
    <div class="replay-row">
      <button type="button" id="replay-play" class="replay-play" aria-pressed="false">Reproducir</button>
      <button type="button" id="replay-start" title="Al principio" aria-label="Al principio">⏮</button>
      <button type="button" id="replay-previous" title="Al cambio anterior" aria-label="Al cambio anterior">◀</button>
      <button type="button" id="replay-next" title="Al cambio siguiente" aria-label="Al cambio siguiente">▶</button>
      <input type="range" id="replay-time" class="replay-time" min="0" max="0" step="any" aria-label="Instante simulado">
      <label class="replay-instant">t =
        <input type="number" id="replay-instant" step="any" aria-label="Instante exacto, en segundos"> s
      </label>
      <button type="button" id="replay-go">Ir</button>
      <label>Velocidad <select id="replay-speed" title="Segundos simulados por segundo real"></select></label>
      <button type="button" id="replay-exit" class="replay-exit">Salir</button>
    </div>
    <div class="replay-row">
      <label id="replay-call-box">Convocatoria <select id="replay-call"></select></label>
      <fieldset class="replay-filters">
        <legend>Casos que se ven</legend>
        <div id="replay-filters"></div>
      </fieldset>
    </div>
    <p id="replay-summary" class="replay-summary" role="status" aria-live="polite"></p>
  </section>
  <div class="modal-overlay" style="display: none;">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="simulation-title" tabindex="-1">
      <h2 id="simulation-title">Resultados de la simulación</h2>
      <p id="simulation-summary" class="simulation-summary" hidden></p>
      <div id="simulation-warnings" class="simulation-warnings" hidden>
        <h3>Avisos</h3>
        <ul></ul>
      </div>
      <section id="simulation-logs" class="simulation-logs" aria-labelledby="simulation-logs-title" hidden>
        <div class="simulation-logs-header">
          <h3 id="simulation-logs-title">Un registro XES por pool</h3>
          <button type="button" id="download-diagram" title="El diagrama de esta simulación, para cargarla otra vez con sus registros">Descargar el diagrama</button>
          <button type="button" id="download-all-logs">Descargar todos</button>
        </div>
        <table class="simulation-logs-table">
          <thead>
            <tr>
              <th scope="col">Pool</th>
              <th scope="col">Casos</th>
              <th scope="col">Fichero</th>
              <th scope="col"><span class="visually-hidden">Acciones</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <h3 id="simulation-preview-title" class="simulation-preview-title" hidden></h3>
      <pre id="simulation-results" aria-labelledby="simulation-preview-title">Results of the simulation</pre>
      <p id="simulation-preview-note" class="simulation-preview-note" hidden></p>
      <button id="close-modal">Cerrar</button>
    </div>
  </div>
  <script src="./dist/modeler.js"></script>
</body>
</html>
